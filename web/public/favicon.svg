      <stop offset="0" stop-color="#2f5d50"/>
      <stop offset="1" stop-color="#c7d8d1"/>
    </linearGradient>
  </defs>
  <path class="frame" d="M4 31V13a12 12 0 0 1 24 0v18z"/>
  <path fill="url(#glass)" d="M6.6 28.4V13a9.4 9.4 0 0 1 18.8 0v15.4z"/>
