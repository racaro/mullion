<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mullion · Sign in</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/lib/theme.js"></script>
  <script type="module" src="/login.js"></script>
</head>
<body class="login-page">
  <header class="login-bar">
    <span></span>
    <div class="bar-actions">
      <button type="button" class="theme-toggle" id="theme-toggle" data-i18n-label="darkMode" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M2 12h2.5M19.5 12H22M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>
      </button>
      <div id="login-lang" data-lang-picker></div>
    </div>
  </header>

  <main class="login">
    <section class="login-card">
      <div class="login-brand">
        <img class="logo-hero logo-light" src="/logo.svg" alt="Mullion" width="660" height="190">
        <img class="logo-hero logo-dark" src="/logo-dark.svg" alt="Mullion" width="660" height="190">
      </div>
      <h1 class="sketch tagline"><span data-i18n="tagline"></span>
        <!-- Hand-drawn underline: two loose strokes, like Excalidraw's rough lines. -->
        <svg class="scribble" viewBox="0 0 300 16" preserveAspectRatio="none" aria-hidden="true">
          <path d="M4 9c38-4 77-5 118-3s88 4 130-1c14-2 28-2 44 0"/>
          <path d="M10 12c45-3 92-3 140-1 40 2 82 2 140-3"/>
        </svg>
      </h1>
      <p class="sketch intro" data-i18n="intro"></p>

      <p id="signin-failed" class="notice error" data-i18n="signInFailed" hidden></p>
      <p id="not-invited" class="notice error" data-i18n="notInvited" hidden></p>

      <a class="google-button" href="/auth/google">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span data-i18n="signIn"></span>
      </a>

      <p class="fine-print muted" data-i18n="pilotNote"></p>
    </section>
  </main>
</body>
</html>
